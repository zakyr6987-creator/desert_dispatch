<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Latihan PHP Bersama Apeli</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: buku tulis kotak-kotak. Sidebar modul di kiri, satu modul per layar di kanan. */
:root{
  --bg:#eef2f7; --grid:rgba(60,90,140,.11); --surface:#ffffff; --surface2:#f4f7fb;
  --ink:#1c2433; --soft:#4b5870; --line:#d3dcea;
  --apple:#e0392d; --apple-deep:#b8271f; --on-apple:#ffffff;
  --leaf:#2f8f46; --leaf-soft:#e0f3e4; --bad:#c4302b; --bad-soft:#fde8e6;
  --hint:#fff3d2; --hint-ink:#6a4a00;
  --code-bg:#172033; --code-fg:#e8eefc; --code-line:#2b3956;
  --c-com:#8793b2; --c-str:#a6e07a; --c-var:#ffb86b; --c-kw:#ff8a98; --c-num:#7fd4ff; --c-tag:#7fd4ff;
  --mline:#3b1820; --amber-ink:#b97a00;
  --f-display:"Baloo 2","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Tahoma,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --grid:rgba(140,170,220,.07); --surface:#172030; --surface2:#1c273a;
    --ink:#e7edf8; --soft:#a3b0c7; --line:#2a3850;
    --apple:#ef5a4d; --apple-deep:#ff8a7e; --on-apple:#2a0b08;
    --leaf:#5bbf68; --leaf-soft:#163122; --bad:#ff8277; --bad-soft:#3a1b1a;
    --hint:#3a2f12; --hint-ink:#ffd37a;
    --code-bg:#0b101a; --code-line:#26334b; --amber-ink:#ffc14d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --grid:rgba(140,170,220,.07); --surface:#172030; --surface2:#1c273a;
  --ink:#e7edf8; --soft:#a3b0c7; --line:#2a3850;
  --apple:#ef5a4d; --apple-deep:#ff8a7e; --on-apple:#2a0b08;
  --leaf:#5bbf68; --leaf-soft:#163122; --bad:#ff8277; --bad-soft:#3a1b1a;
  --hint:#3a2f12; --hint-ink:#ffd37a;
  --code-bg:#0b101a; --code-line:#26334b; --amber-ink:#ffc14d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;
}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0 0 .8em}
code,.mono{font-family:var(--f-mono);font-size:.88em}
:not(pre)>code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:.05em .38em}
a{color:var(--apple-deep)}
:focus-visible{outline:3px solid var(--apple);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:18px}
.top .brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 280px}
.top h1{font-size:1.55rem;font-weight:800}
.top .sub{color:var(--soft);font-size:.9rem;margin:0}
.meter{flex:0 1 280px;min-width:200px}
.meter .row{display:flex;justify-content:space-between;font-size:.86rem;color:var(--soft);margin-bottom:4px}
.meter .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .4s}

/* Shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
nav.mods{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:calc(100vh - 24px);overflow:auto}
nav.mods h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-family:var(--f-body);font-weight:700;margin:4px 8px 8px}
nav.mods a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:7px 8px;border-radius:9px;font-size:.93rem}
nav.mods a:hover{background:var(--surface2)}
nav.mods a[aria-current="page"]{background:var(--apple);color:var(--on-apple);font-weight:700}
nav.mods .no{font-family:var(--f-mono);font-size:.76rem;min-width:2.2em;text-align:center;border:1px solid currentColor;border-radius:6px;padding:0 4px;opacity:.85}
nav.mods .ct{margin-left:auto;font-size:.78rem;font-variant-numeric:tabular-nums;opacity:.85}
nav.mods a.done .ct::before{content:"✓ "}

/* Module */
main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.mhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mhead .txt{flex:1 1 320px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--apple-deep);margin:0 0 4px}
.mhead h2{font-size:2rem;font-weight:800}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:.98rem}
.sec{font-size:1.25rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec small{font-family:var(--f-body);font-weight:400;color:var(--soft);font-size:.85rem}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:0 0 16px;padding:0;list-style:none}
.points li{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.points li b{display:block;font-family:var(--f-mono);font-size:.84rem;color:var(--apple-deep);margin-bottom:2px;overflow-wrap:anywhere}

/* Code */
.code{border:1px solid var(--code-line);border-radius:10px;background:var(--code-bg);margin:12px 0;overflow:hidden}
.code .bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--code-line);color:#9fb0d4;font-family:var(--f-mono);font-size:.76rem}
.code .bar2 b{color:#8fd3ff;font-weight:600}
.code button{font:inherit;color:#cfe0ff;background:transparent;border:1px solid var(--code-line);border-radius:6px;padding:1px 8px;cursor:pointer}
.code button:hover{background:#22304d}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;color:var(--code-fg);font-family:var(--f-mono);font-size:.86rem;line-height:1.55;tab-size:4}
.t-com{color:var(--c-com);font-style:italic}.t-str{color:var(--c-str)}.t-var{color:var(--c-var)}.t-kw{color:var(--c-kw)}.t-num{color:var(--c-num)}.t-tag{color:var(--c-tag)}
.blank{background:rgba(255,200,80,.25);border-bottom:2px dashed #ffc14d;color:#ffd98a;padding:0 .35em;border-radius:3px}

/* Questions */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.q.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.q .qh{display:flex;gap:10px;align-items:flex-start}
.q .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.q.ok .n{background:var(--leaf);color:#fff}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-bottom:3px}
.qt{margin:0}
.opts{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.opts button{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opts button:hover:not(:disabled){border-color:var(--apple)}
.opts .k{flex:none;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--soft)}
.opts .tx{min-width:0;overflow-wrap:anywhere}
.opts button.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts button:disabled{cursor:default}
.fillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fillrow input{flex:1 1 200px;min-width:0;font-family:var(--f-mono);font-size:.95rem;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;background:var(--apple);color:var(--on-apple)}
.btn:hover{background:var(--apple-deep);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.fb{display:none;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem;background:var(--surface2);border:1px solid var(--line)}
.fb.show{display:flex}
.fb.good{background:var(--leaf-soft);border-color:var(--leaf)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .m{flex:none}.fb .t{min-width:0}
.fb .acts{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}

/* Task */
.task h3{font-size:1.2rem}
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--surface2)}
details>summary{cursor:pointer;padding:9px 12px;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--apple-deep)}
details[open]>summary::before{content:"▾ "}
details .in{padding:0 12px 10px}
.hintbox{background:var(--hint);color:var(--hint-ink);border-radius:8px;padding:8px 12px;margin:0}
.donerow{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:700}
.donerow input{width:20px;height:20px;accent-color:var(--leaf)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meter .row.sm{margin:6px 0 0;font-size:.78rem}
.chip{display:inline-block;background:var(--hint);color:var(--hint-ink);border-radius:99px;padding:0 8px;font-weight:700;font-size:.76rem}
.btn.sm{padding:5px 12px;font-size:.85rem}
a.btn{display:inline-block;text-decoration:none}
nav.mods .ico{display:inline-grid;place-items:center;min-width:2.2em}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .txt{flex:1 1 340px;min-width:0}
.hero h2{font-size:2rem;font-weight:800}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.garden a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);padding:6px 2px;border-radius:10px;font-size:.76rem}
.garden a:hover{background:var(--surface2)}
.garden b{font-family:var(--f-mono);font-weight:600}
.phase{margin:18px 0 8px;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.phase small{font-family:var(--f-body);font-weight:400;color:var(--soft);font-size:.85rem;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.mc{display:block;text-decoration:none;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.mc:hover{border-color:var(--apple)}
.mc .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.mc h3{font-size:1.1rem}
.mc .rm{font-family:var(--f-mono);font-size:.74rem;color:var(--apple-deep)}
.mc p{font-size:.88rem;color:var(--soft);margin:4px 0 8px}
.mc .bar{height:7px}
.mc.full{border-color:var(--leaf);background:var(--leaf-soft)}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast .tb{pointer-events:auto;display:flex;gap:12px;align-items:center;max-width:460px;background:var(--surface);color:var(--ink);border:2px solid var(--leaf);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:tin .35s ease-out}
@keyframes tin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#fx i{position:absolute;top:-24px;width:14px;height:14px;border-radius:50% 50% 45% 45%;background:var(--apple);animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){#toast .tb{animation:none}#fx{display:none}}
.xhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.xhead b{font-family:var(--f-display);font-size:1.15rem}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--soft)}
.navg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.navg button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.navg button.ans{background:var(--leaf-soft);border-color:var(--leaf)}
.navg button.cur{outline:3px solid var(--apple);outline-offset:1px}
.opts button.sel{border-color:var(--apple);background:var(--surface2)}
.xnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
.score .big small{font-size:1.2rem;color:var(--soft);font-weight:600}
.brk{display:grid;gap:6px;margin:12px 0}
.brk a{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 40px;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-size:.9rem}
.brk a:hover b{text-decoration:underline}
.brk b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .bar{height:9px}
.brk .bar i.low{background:var(--bad)}
.q.bad{border-color:var(--bad);background:var(--bad-soft)}
.q.bad .n{background:var(--bad);color:#fff}
.chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.chips button{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ans-line{margin:8px 0 0;font-size:.95rem}
.again{display:flex;justify-content:center;margin:0 0 14px}
footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--soft);font-size:.85rem;margin-top:6px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.mods{position:static;max-height:none;padding:8px}
  nav.mods h2{display:none}
  nav.mods .list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  nav.mods a{flex:none;white-space:nowrap;border:1px solid var(--line)}
  .mhead h2{font-size:1.6rem}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
</style>

<script>
MODS.push({n:1,rom:'I',pert:'1',title:'HTML',
intro:'Halo! HTML itu kerangka rumah. Tanpa kerangka, CSS dan PHP nggak punya tempat menempel.',
points:[
['<html> <head> <body>','Tiga tag utama. head berisi info dokumen (misalnya title), body berisi apa yang tampil di browser.'],
['tag buka dan tutup','Hampir semua tag harus ditutup: <p>...</p>. Tag tunggal seperti <br>, <hr>, <img> tidak perlu penutup.'],
['<h1> sampai <h6>, <p>','Heading untuk judul dan sub judul, paragraf untuk teks biasa.'],
['<a href> dan <img src>','Link butuh atribut href. Gambar butuh atribut src.'],
['<ul> <ol> <li>','ul untuk daftar bertitik, ol untuk daftar bernomor, li untuk tiap itemnya.'],
['<table> <tr> <th> <td>','table membungkus tabel, tr satu baris, th judul kolom, td isi sel.'],
['<div id="...">','Pembagi area halaman: header, content, sidebar, footer.']
],
code:{fn:'prak1.html',lang:'html',src:`<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Belajar Membuat Heading dan Paragraph</title>
</head>
<body>
    <h1>Heading ke-1</h1>
    <h2>Heading ke-2</h2>
    <p><strong>ini adalah contoh paragraph</strong></p>
</body>
</html>`},
qs:[
{k:'pilihan',t:'mcq',q:'Tag mana yang menampilkan teks pada tab browser?',o:['<title>','<body>','<h1>','<p>'],why:'<title> ada di dalam <head>. Isinya muncul di tab browser, bukan di halaman.'},
{k:'pilihan',t:'mcq',q:'Daftar yang itemnya bernomor 1, 2, 3 dibuat dengan tag...',o:['<ol>','<ul>','<li>','<table>'],why:'ol = ordered list (berurutan). ul = unordered list (bertitik). li dipakai di dalam keduanya.'},

task:{title:'Saldo Tabungan',
brief:'Seorang nasabah menabung Rp2.000.000 di bank X. Bunga 3% per bulan dari saldo awal. Hitung saldo akhir setelah 11 bulan, lalu tampilkan.',
hint:'Bunga per bulan = saldoAwal * bunga. Kalikan dengan jumlah bulan, lalu tambahkan ke saldo awal.',
fn:'tabungan.php',lang:'php',
sol:`<?php
$saldoAwal = 2000000;
$bunga     = 0.03;
$bulan     = 11;

// bunga 3% dari saldo awal, tiap bulan

   . number_format($saldoAkhir, 0, ',', '.') . ",-";

task:{title:'Tiga Soal Perulangan',
brief:'(1) Tampilkan bilangan bulat 5 sampai 100 yang kelipatan 10. (2) Jumlahkan bilangan 2 sampai 50. (3) Hitung ada berapa bilangan dari 3 sampai 127 yang kelipatan 6.',
hint:'Ketiganya memakai loop dan variabel penampung ($jumlah, $banyak). Kelipatan dicek dengan %.',
fn:'tugas_perulangan.php',lang:'php',
sol:`<?php
// 1. kelipatan 10 dari 5 sampai 100
for ($i = 5; $i <= 100; $i++) {
    if ($i % 10 == 0) echo $i . " ";
}
echo "<br>";

// 2. jumlah bilangan 2 sampai 50
$jumlah = 0;
for ($i = 2; $i <= 50; $i++) {
    $jumlah += $i;
}
echo "Jumlah 2-50 = $jumlah<br>";

// 3. banyaknya kelipatan 6 dari 3 sampai 127
$banyak = 0;
for ($i = 3; $i <= 127; $i++) {
    if ($i % 6 == 0) $banyak++;
}
echo "Banyak kelipatan 6 = $banyak";
?>`,
note:'Hasil yang benar: 10 20 30 ... 100, jumlahnya 1274, dan banyaknya 21 bilangan.'}
});

task:{title:'Nilai Siswa (Array Asosiatif)',
brief:'Buat array asosiatif berisi 4 nama siswa beserta nilainya. Tampilkan dengan foreach, lalu tampilkan lagi setelah diurutkan: nilai tertinggi dulu (arsort), dan nama A-Z (ksort).',
hint:'Gunakan arsort($nilai) untuk menurut nilai terbesar, dan ksort($nilai) untuk menurut abjad nama. Panggil foreach setelah tiap pengurutan.',
fn:'nilai_siswa.php',lang:'php',
sol:`<?php
$nilai = array("Dewi" => 88, "Andi" => 75, "Citra" => 92, "Budi" => 80);

echo "<b>Asli</b><br>";
foreach ($nilai as $nama => $n) { echo "$nama: $n<br>"; }

arsort($nilai);   // nilai terbesar dulu
echo "<b>arsort</b><br>";
foreach ($nilai as $nama => $n) { echo "$nama: $n<br>"; }

ksort($nilai);    // nama A-Z
echo "<b>ksort</b><br>";
foreach ($nilai as $nama => $n) { echo "$nama: $n<br>"; }
?>`,
note:'Urutan arsort: Citra 92, Dewi 88, Budi 80, Andi 75. Urutan ksort: Andi, Budi, Citra, Dewi. Bonus tugas modul: coba 5 fungsi array lain seperti array_pop, in_array, array_reverse, array_sum, array_keys.'}

sol:`<?php
function isGanjil($n) {

task:{title:'Buku Tamu Aman',
brief:'Lengkapi buku tamu: tabel bukutamu, form isian, proses simpan, dan halaman daftar komentar yang menampilkan semua data dalam tabel.',
hint:'Pakai prepared statement untuk INSERT, dan htmlspecialchars() saat mencetak. Tampilkan "Belum ada komentar" kalau data kosong.',
fn:'tampil_data.php',lang:'php',
sol:`-- tabel
CREATE TABLE bukutamu (
    id INT NOT NULL AUTO_INCREMENT,
    nama VARCHAR(25), email VARCHAR(50), url VARCHAR(100), komentar TEXT,
    PRIMARY KEY (id)
);

<?php
// proses_tambah.php
require("koneksi.php");
if (isset($_POST['kirim'])) {
    $stmt = mysqli_prepare($conn,
        "INSERT INTO bukutamu (nama, email, url, komentar) VALUES (?, ?, ?, ?)");
    mysqli_stmt_bind_param($stmt, "ssss",
        $_POST['nama'], $_POST['email'], $_POST['url'], $_POST['komentar']);
    mysqli_stmt_execute($stmt);
    echo "Terima kasih, " . htmlspecialchars($_POST['nama']);
}

// tampil_data.php
require("koneksi.php");
$result = mysqli_query($conn, "SELECT nama, email, url, komentar FROM bukutamu");
if (mysqli_num_rows($result) > 0) {
    echo "<table border='1'><tr><th>Nama</th><th>Email</th><th>URL</th><th>Komentar</th></tr>";
    while ($r = mysqli_fetch_array($result)) {
        echo "<tr><td>" . htmlspecialchars($r['nama']) . "</td>";
        echo "<td>" . htmlspecialchars($r['email']) . "</td>";
        echo "<td>" . htmlspecialchars($r['url']) . "</td>";
        echo "<td>" . htmlspecialchars($r['komentar']) . "</td></tr>";
    }
    echo "</table>";
} else {
    echo "<i>Belum ada komentar.</i>";
}
?>`,
note:'Dalam praktik, bagian setelah komentar // proses_tambah.php dan // tampil_data.php dipisah menjadi dua file. Modul menuliskan link URL dengan <a href="?php echo ...">, yang kurang tanda "<" di depannya, jadi periksa itu juga.'}

task:{title:'Login untuk Siswa',
brief:'Buat halaman login untuk aplikasi CRUD siswa. Hanya yang sudah login boleh membuka index.php. Gunakan session dan password yang di-hash.',
hint:'Buat tabel users (username, password hash). Login memakai password_verify(). Di index.php, cek $_SESSION sebelum menampilkan apa pun.',
fn:'login.php',lang:'php',
sol:`-- tabel pengguna (password diisi hasil password_hash)
CREATE TABLE users (
    id INT AUTO_INCREMENT PRIMARY KEY,
    username VARCHAR(30) UNIQUE NOT NULL,
    password VARCHAR(255) NOT NULL
);

<?php
// buat_user.php (jalankan sekali)
include "koneksi.php";
$hash = password_hash("rahasia123", PASSWORD_DEFAULT);
$stmt = mysqli_prepare($connect, "INSERT INTO users (username, password) VALUES (?, ?)");
$u = "admin";
mysqli_stmt_bind_param($stmt, "ss", $u, $hash);
mysqli_stmt_execute($stmt);

// login.php
session_start();
include "koneksi.php";
$pesan = "";

if (isset($_POST['login'])) {
    $stmt = mysqli_prepare($connect, "SELECT password FROM users WHERE username = ?");
    mysqli_stmt_bind_param($stmt, "s", $_POST['username']);
    mysqli_stmt_execute($stmt);
    mysqli_stmt_bind_result($stmt, $hash);

    if (mysqli_stmt_fetch($stmt) && password_verify($_POST['password'], $hash)) {
        $_SESSION['login'] = true;
        $_SESSION['username'] = $_POST['username'];
        header("Location: index.php");
        exit;
    }
    $pesan = "Username atau password salah";
}

// di baris paling atas index.php:
// session_start();
// if (!isset($_SESSION['login'])) { header("Location: login.php"); exit; }
?>`,
note:'Satu pesan yang sama untuk username salah dan password salah lebih aman daripada pesan terpisah, karena tidak membocorkan nama pengguna yang terdaftar. Bagian setelah komentar // dipisah menjadi file masing-masing saat kamu praktik.'}
});

code:{fn:'class_mobil.php',lang:'php',src:`<?php
class Mobil {
    var $bensin;

    function maju()   { $this->bensin = $this->bensin - 2; }
    function mundur() { $this->bensin = $this->bensin - 1; }
    function isibensin($tambah) { $this->bensin = $this->bensin + $tambah; }
    function sisabensin() { return $this->bensin; }
}

$mobil1 = new Mobil();
$mobil1->isibensin(6);
echo "Sisa bensin : ", $mobil1->sisabensin(), " Liter<br/>";
$mobil1->maju();
echo "Sisa bensin : ", $mobil1->sisabensin(), " Liter<br/>";
?>`},

{k:'output',t:'mcq',q:'Berapa sisa bensin yang tercetak?',code:'<?php\n// class Mobil dari kode contoh di atas\n$m = new Mobil();\n$m->isibensin(6);\n$m->maju();      // bensin berkurang 2\n$m->mundur();    // bensin berkurang 1\necho $m->sisabensin();\n?>',lang:'php',o:['3','4','5','6'],why:'6 - 2 = 4, lalu 4 - 1 = 3.'},

task:{title:'Daftar Mahasiswa dengan Class',
brief:'Buat program yang memakai class Mahasiswa untuk membuat form input sederhana daftar mahasiswa di kelasmu. Data yang dimasukkan harus tampil sebagai daftar.',
hint:'Class Mahasiswa punya property nim dan nama, serta method tampil(). Simpan data di $_SESSION sebagai array, lalu buat object saat menampilkan.',
fn:'daftar_mahasiswa.php',lang:'php',
sol:`<?php
class Mahasiswa {
    public $nim;
    public $nama;

    function __construct($nim, $nama) {
        $this->nim  = $nim;
        $this->nama = $nama;
    }
    function tampil() {
        return htmlspecialchars($this->nim . " - " . $this->nama);
    }
}

session_start();
if (!isset($_SESSION['daftar'])) { $_SESSION['daftar'] = array(); }

if (isset($_POST['simpan'])) {
    $_SESSION['daftar'][] = array($_POST['nim'], $_POST['nama']);
}
?>
<h2>Daftar Mahasiswa</h2>
<form method="post">
    NIM <input type="text" name="nim">
    Nama <input type="text" name="nama">
    <input type="submit" name="simpan" value="Simpan">
</form>

<ol>
<?php
foreach ($_SESSION['daftar'] as $d) {
    $m = new Mahasiswa($d[0], $d[1]);
    echo "<li>" . $m->tampil() . "</li>";
}
?>
</ol>`,
note:'Yang disimpan di session adalah array biasa, lalu object dibuat saat ditampilkan. Dengan begitu tidak ada masalah object yang gagal dibaca ulang. Kalau mau lanjut, simpan datanya ke MySQL seperti Modul XII.'}

/* ---------- Penyorot kode ---------- */
const KWPHP='function|if|else|elseif|while|for|foreach|do|switch|case|break|echo|return|class|new|isset|include|require|define|exit|die|public|private|var|as|and|or|xor|null|true|false';
const KWSQL='SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|DATABASE|TABLE|USE|PRIMARY|KEY|AUTO_INCREMENT|NOT|NULL|INT|VARCHAR|TEXT|UNIQUE|ORDER|BY|FORM';
const RES={
  php:{re:new RegExp('(^--[^\\n]*|//[^\\n]*|#[^\\n]*|/\\*[\\s\\S]*?\\*/)|("(?:[^"\\n]|\\\\.)*"|\'(?:[^\'\\n]|\\\\.)*\')|(\\$\\w+)|(<\\?php|<\\?=|\\?>)|(\\b(?:'+KWPHP+')\\b)|(\\b\\d+(?:\\.\\d+)?\\b)','gm'),cls:['t-com','t-str','t-var','t-kw','t-kw','t-num']},
  sql:{re:new RegExp('(--[^\\n]*)|(\'(?:[^\'\\n]|\\\\.)*\')|\\b('+KWSQL+')\\b|(\\b\\d+\\b)','gi'),cls:['t-com','t-str','t-kw','t-num']},
  html:{re:/(<\/?[a-zA-Z!][^>]*>)|(&\w+;)/g,cls:['t-tag','t-num']},
  css:{re:/(\/\*[\s\S]*?\*\/)|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?(?:px|%|em)?)|(\b(?:solid|none|auto|center|relative|absolute|fixed|collapse)\b)/g,cls:['t-com','t-num','t-kw']}
};
function hl(src,lang){
  const d=RES[lang]; let out='';
  if(!d){out=esc(src);}
  else{
    const re=d.re; re.lastIndex=0; let last=0,m;
    while((m=re.exec(src))){
      if(m[0]===''){re.lastIndex++;continue;}
      out+=esc(src.slice(last,m.index));
      let gi=1; while(gi<m.length&&m[gi]===undefined)gi++;
      out+='<span class="'+d.cls[gi-1]+'">'+esc(m[0])+'</span>';
      last=m.index+m[0].length;
    }
    out+=esc(src.slice(last));
  }
  return out.replace(/___/g,'<span class="blank">&nbsp;&nbsp;?&nbsp;&nbsp;</span>');
}
function codeBlock(fn,lang,src,copy){
  return '<div class="code"><div class="bar2"><b>'+esc(fn||'')+'</b><span>'+(lang||'').toUpperCase()+(copy?' <button type="button" data-act="copy">Salin</button>':'')+'</span></div><pre><code>'+hl(src,lang)+'</code></pre></div>';
}

/* ---------- Pengacak tetap ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function order(id,n){
  let s=hash(id)||1; const a=[...Array(n).keys()];
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};
  for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

  el.outerHTML=qHtml(m,+mm[2]);
  const ne=document.getElementById(id); if(ne)ne.focus({preventScroll:true});

function copyCode(btn){
  const pre=btn.closest('.code').querySelector('pre'), txt=pre.innerText;
  const fallback=()=>{try{const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent='Teks terpilih';}catch(e){}};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Tersalin';setTimeout(()=>btn.textContent='Salin',1600);},fallback);}catch(e){fallback();}
}
const main=document.getElementById('main');
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act, id=b.dataset.q;
  if(act==='copy'){copyCode(b);return;}
  if(examClick(act,b))return;
  if(hellClick(act,b))return;
  if(act==='pick'){
    if(S.ok[id])return; const o=+b.dataset.o;
    if(o===0){if(!(W[id]&&W[id].length))streak++;else streak=0;S.ok[id]=1;save();}else{streak=0;(W[id]=W[id]||[]).push(o);}
    redraw(id);

function checkFill(id){
  const mm=/^m(\d+)q(\d+)$/.exec(id), q=MODS[+mm[1]-1].qs[+mm[2]-1];
  const v=document.getElementById(id+'-in').value;
  if(q.ans.some(a=>norm(a)===norm(v))){if(WF[id]===undefined)streak++;else streak=0;S.ok[id]=1;(S.fill=S.fill||{})[id]=v.trim();save();}
  else{streak=0;WF[id]=v.trim()||' ';}
  redraw(id);
}

function resetModule(n,btn){
  if(!btn.dataset.sure){btn.dataset.sure='1';btn.textContent='Yakin? Klik sekali lagi';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent='Ulangi modul ini';}},4000);return;}
  const m=MODS[n-1];
  for(let i=1;i<=m.qs.length;i++){const id='m'+n+'q'+i;delete S.ok[id];if(S.fill)delete S.fill[id];delete W[id];delete R[id];delete WF[id];}
  delete S.ok['m'+n+'t'];save();streak=0;show(n);window.scrollTo(0,0);
}

let EX=null, tmr=null;
const pad=x=>(x<10?'0':'')+x, fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null;}}
function shuffle(a,seed){let x=seed||1;a=a.slice();for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;const j=Math.abs(x)%(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickExam(){
  const all=[], pick=[];
  MODS.forEach(m=>m.qs.forEach((q,i)=>all.push({m:m.n,i:i+1})));
  MODS.forEach(m=>{const r=Math.floor(Math.random()*m.qs.length);pick.push({m:m.n,i:r+1});});
  const rest=all.filter(a=>!pick.some(p=>p.m===a.m&&p.i===a.i));
  const sd=(Date.now()%100000)+7;
  return shuffle(pick.concat(shuffle(rest,sd).slice(0,7)),sd+3);
}
function isAns(i){const a=EX.ans[i];return a!==undefined&&a!=='';}
function exQ(i){const p=EX.items[i];return MODS[p.m-1].qs[p.i-1];}
function exCorrect(i){
  const q=exQ(i), a=EX.ans[i];
  if(!isAns(i))return false;
  return q.t==='mcq'?a===0:q.ans.some(x=>norm(x)===norm(a));
}

function exFinish(){
  if(!EX||EX.done)return;

  S.exam.n=(S.exam.n||0)+1;if(x.score>S.exam.best)S.exam.best=x.score;save();
  renderExamResult();updateProgress(true);window.scrollTo(0,0);

function examClick(act,b){
  if(act==='xstart'||act==='xretry'){EX={items:pickExam(),ans:{},cur:0,end:Date.now()+30*60*1000,done:false};showExam();window.scrollTo(0,0);return true;}
  if(!/^x/.test(act))return false;
  if(!EX)return true;
  if(act==='xfilter'){EX.f=b.dataset.f;renderExamResult();return true;}
  if(EX.done)return true;
  const keepFill=()=>{const el=document.getElementById('xin');if(el)EX.ans[EX.cur]=el.value.trim();};
  if(act==='xpick'){EX.ans[EX.cur]=+b.dataset.o;renderExamRun();}
  else if(act==='xgo'){keepFill();EX.cur=+b.dataset.i;renderExamRun();}
  else if(act==='xprev'){keepFill();EX.cur=Math.max(0,EX.cur-1);renderExamRun();}
  else if(act==='xnext'){keepFill();EX.cur=Math.min(EX.items.length-1,EX.cur+1);renderExamRun();}
  else if(act==='xfinish'){keepFill();if(!b.dataset.sure&&EX.items.some((_,k)=>!isAns(k))){b.dataset.sure='1';b.textContent='Masih ada yang kosong. Klik lagi untuk menyelesaikan';return true;}exFinish();}
  return true;
}

function wsRefresh(){const v=document.getElementById('wsview'),c=document.getElementById('wscount');if(v){v.innerHTML=wsHtml(HL.ws);v.scrollTop=v.scrollHeight;}if(c)c.textContent=HL.ws.length+' simbol';}
function drawPiet(drag){
  const cv=document.getElementById('piet');if(!cv)return;
  const g=cv.getContext('2d');
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const v=HL.gx[y*GW+x];g.fillStyle=ESO.pcolor(v===255?18:v);g.fillRect(x*CS,y*CS,CS,CS);}
  g.strokeStyle='rgba(120,120,120,.35)';g.lineWidth=1;g.beginPath();
  for(let x=0;x<=GW;x++){g.moveTo(x*CS+.5,0);g.lineTo(x*CS+.5,GH*CS);}
  for(let y=0;y<=GH;y++){g.moveTo(0,y*CS+.5);g.lineTo(GW*CS,y*CS+.5);}
  g.stroke();
  if(drag){const x0=Math.min(drag.x0,drag.x1),x1=Math.max(drag.x0,drag.x1),y0=Math.min(drag.y0,drag.y1),y1=Math.max(drag.y0,drag.y1);g.strokeStyle='#ff3b1f';g.lineWidth=3;g.strokeRect(x0*CS+1.5,y0*CS+1.5,(x1-x0+1)*CS-3,(y1-y0+1)*CS-3);}
}
function setupPiet(){
  const cv=document.getElementById('piet');if(!cv)return;
  cv.width=GW*CS;cv.height=GH*CS;drawPiet();
  const cell=e=>{const r=cv.getBoundingClientRect();return[Math.max(0,Math.min(GW-1,Math.floor((e.clientX-r.left)/CS))),Math.max(0,Math.min(GH-1,Math.floor((e.clientY-r.top)/CS)))];};
  let drag=null;
  cv.addEventListener('pointerdown',e=>{
    if(HL.tool==='pan')return;
    e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}
    const[x,y]=cell(e);drag={x0:x,y0:y,x1:x,y1:y};
    if(HL.tool==='brush'){HL.gx[y*GW+x]=HL.color;}
    drawPiet(HL.tool==='rect'?drag:null);
  });
  cv.addEventListener('pointermove',e=>{
    if(!drag)return;const[x,y]=cell(e);drag.x1=x;drag.y1=y;
    if(HL.tool==='brush')HL.gx[y*GW+x]=HL.color;
    drawPiet(HL.tool==='rect'?drag:null);
  });
  const end=()=>{
    if(!drag)return;
    if(HL.tool==='rect'){for(let y=Math.min(drag.y0,drag.y1);y<=Math.max(drag.y0,drag.y1);y++)for(let x=Math.min(drag.x0,drag.x1);x<=Math.max(drag.x0,drag.x1);x++)HL.gx[y*GW+x]=HL.color;}
    drag=null;drawPiet();
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function setPietKey(){
  const g=ESO.pietGen('Hello, World!');HL.gx.fill(255);
  for(const k in g.cells){const y=Math.floor(k/400),x=k%400;if(x<GW&&y<GH)HL.gx[y*GW+x]=g.cells[k];}
}
function codeBody(lg){
  const h=HL;
  if(lg==='Brainfuck'){
    return '<p class="ans-line">Tulis program Brainfuck yang mencetak <b>Hello, World!</b> (versi tanpa koma juga diterima). Ingat: kamu perlu kode ASCII tiap huruf. H = 72, e = 101, l = 108, o = 111.</p>'
     +'<details><summary>Contekan perintah</summary><div class="in"><p class="hintbox"><b>+</b> tambah sel · <b>-</b> kurangi sel · <b>&gt;</b> pindah ke sel kanan · <b>&lt;</b> pindah ke kiri · <b>[</b> <b>]</b> ulangi selama sel bukan nol · <b>.</b> cetak karakter · <b>,</b> baca input.</p></div></details>'
     +'<textarea id="bfsrc" class="bfsrc" rows="7" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Kode Brainfuck">'+esc(h.bf)+'</textarea>';
  }
  if(lg==='Whitespace'){
    return '<p class="ans-line">Tulis program Whitespace yang mencetak <b>Hello, World!</b>. Di layar: <b>·</b> = Spasi (S), <b>→</b> = Tab (T), <b>↵</b> = Baris baru (L). Tombol pintas membantu menulis angka dan perintah cetak.</p>'
     +'<details><summary>Contekan perintah</summary><div class="in"><p class="hintbox">Push angka: <b>S S</b> + tanda (<b>S</b> = +, <b>T</b> = −) + bit (<b>S</b> = 0, <b>T</b> = 1) + <b>L</b>. Cetak karakter: <b>T L S S</b>. Akhir program: <b>L L L</b>. Contoh push 65: S S S T S S S S S T L.</p></div></details>'
     +'<div id="wsview" class="wsview" role="img" aria-label="Isi program Whitespace">'+wsHtml(h.ws)+'</div>'
     +'<div class="toolrow"><button type="button" class="btn ghost sm" data-act="wsadd" data-s="S">Spasi (S)</button><button type="button" class="btn ghost sm" data-act="wsadd" data-s="T">Tab (T)</button><button type="button" class="btn ghost sm" data-act="wsadd" data-s="L">Baris baru (L)</button><button type="button" class="btn ghost sm" data-act="wsdel">Hapus terakhir</button><button type="button" class="btn ghost sm" data-act="wsclr">Kosongkan</button><span class="timer" id="wscount">'+h.ws.length+' simbol</span></div>'
     +'<div class="toolrow"><label>Angka <input type="number" id="wsnum" class="wsnum" min="0" max="255" value="72" aria-label="Angka untuk push"></label><button type="button" class="btn sm" data-act="wspush">Push angka</button><button type="button" class="btn sm" data-act="wsout">Cetak karakter</button><button type="button" class="btn sm" data-act="wsend">Akhir (L L L)</button></div>';
  }
  const sw=[];for(let l=0;l<3;l++)for(let k=0;k<6;k++){const v=l*6+k;sw.push('<button type="button" class="sw" data-act="pcolor" data-c="'+v+'" aria-pressed="'+(h.color===v)+'" aria-label="'+PNAME[k]+' '+LNAME[l]+'" style="background:'+ESO.pcolor(v)+'"></button>');}
  sw.push('<button type="button" class="sw" data-act="pcolor" data-c="18" aria-pressed="'+(h.color===18)+'" aria-label="putih (juga penghapus)" style="background:#fff"></button>');
  sw.push('<button type="button" class="sw" data-act="pcolor" data-c="19" aria-pressed="'+(h.color===19)+'" aria-label="hitam" style="background:#000"></button>');
  const tl=(t,n)=>'<button type="button" class="btn ghost sm" data-act="ptool" data-t="'+t+'" aria-pressed="'+(h.tool===t)+'">'+n+'</button>';
  return '<p class="ans-line">Lukis program Piet yang mencetak <b>Hello, World!</b>. Pointer mulai dari kotak kiri atas dan bergerak ke kanan. Gambarmu berukuran '+GW+' x '+GH+' kotak: geser ke samping bila perlu.</p>'
   +'<details><summary>Contekan perintah</summary><div class="in"><p class="hintbox"><b>push</b>: rona sama, kecerahan +1 (terang, normal, gelap, lalu kembali terang). Angkanya adalah <b>jumlah kotak</b> di blok yang ditinggalkan. <b>out(char)</b>: rona +5, kecerahan +2. Urutan rona: merah, kuning, hijau, cyan, biru, magenta. Contoh per huruf: blok 72 kotak (H), blok 1 kotak satu tingkat lebih gelap di kanannya (push 72), lalu blok berikutnya dengan rona +5 dan kecerahan +2 (cetak). Di ujung, kurung dengan hitam agar program berhenti.</p></div></details>'
   +'<div class="toolrow" role="group" aria-label="Alat">'+tl('rect','Persegi')+tl('brush','Kuas')+tl('pan','Gulir')+'<button type="button" class="btn ghost sm" data-act="pclear">Bersihkan</button></div>'
   +'<div class="toolrow" role="group" aria-label="Palet warna">'+sw.join('')+'</div>'
   +'<div class="pietwrap"><canvas id="piet" class="piet" style="touch-action:'+(h.tool==='pan'?'auto':'none')+'" aria-label="Kanvas program Piet"></canvas></div>';
}
function showHell(){
  cur='hell';
  if(!HL)HL=newHL();
  const f=document.getElementById('fx');
  if(!f.querySelector('.em')){let e='';for(let n=0;n<18;n++)e+='<i class="em" style="left:'+Math.round(Math.random()*98)+'%;animation-delay:'+(Math.random()*3).toFixed(2)+'s"></i>';f.innerHTML=e;}
  const h=HL;let out='';
  if(h.done){
    const win=h.ok===NSTEP, mood=win?'hurt':(h.ok>=10?'evil':'laugh');
    const msg=win?'AARGH! Lima belas dari lima belas! Kamu menaklukkan nerakaku. Ambil lencanamu dan pergilah.':(h.ok>=10?'Hmph. Kamu lolos kali ini, tapi tidak sempurna. Berani coba lagi?':'MUAHAHAHA! Neraka esolang terlalu panas buatmu. Coba lagi kalau berani!');
    out='<section class="panel hellbox"><div class="hero"><span>'+banana(mood,150)+'</span><div class="txt"><p class="eyebrow">Hasil Neraka Esolang</p><h2>'+h.ok+' dari '+NSTEP+'</h2><div class="bubble">'+esc(msg)+'</div><div class="cta"><button type="button" class="btn" data-act="hretry">Coba lagi</button><a class="btn ghost" href="#beranda">Kabur ke beranda</a></div></div></div></section>';
  }else{
    const s=ST[h.i], loc=h.i%5, eb=s.lg+' · soal '+(loc+1)+' dari 5 · langkah '+(h.i+1)+'/'+NSTEP;
    if(s.kind==='mcq'){
      const ord=order('hell'+h.i,s.o.length), ans=h.pick!==null, good=ans&&h.pick===0;
      const mood=!ans?'evil':(good?'hurt':'laugh');
      const say=!ans?TAUNT[h.i]:(good?'Grr... benar. Beruntung kamu.':'MUAHAHA! Salah! Pitchforkku lapar.');
      out='<section class="panel hellbox"><div class="hero"><span>'+banana(mood,132)+'</span><div class="txt"><p class="eyebrow">'+esc(eb)+'</p><h2>Mr. Pisang Iblis</h2><div class="bubble" role="status">'+esc(say)+'</div></div></div></section>';
      out+='<section class="panel"><div class="q" id="hq" tabindex="-1"><div class="qh"><span class="n">'+(loc+1)+'</span><div style="min-width:0;flex:1"><span class="tag">'+TAG[s.k]+'</span><p class="qt">'+esc(s.q)+'</p>'+(s.code?codeBlock('','bf',s.code,false):'')+'<ul class="opts">'
        +ord.map((oi,pos)=>{let c='';if(ans){if(oi===0)c='right';else if(oi===h.pick)c='wrong';}return '<li><button type="button" class="'+c+'" data-act="hpick" data-o="'+oi+'"'+(ans?' disabled':'')+'><span class="k">'+'ABCD'[pos]+'</span><span class="tx">'+esc(s.o[oi])+'</span></button></li>';}).join('')+'</ul>'
        +(ans?fbHtml(good?'good':'bad','<b>'+(good?'Tepat.':'Salah.')+'</b> Jawabannya: '+esc(s.o[0])+'. '+esc(s.why),good?'wow':'oops','<div class="acts"><button type="button" class="btn" data-act="hnext">Lanjut</button></div>'):'')
        +'</div></div></div></section>';
    }else{
      const mood=h.solved?'hurt':(h.gave?'laugh':'evil');
      const say=h.solved?(h.gave?'Hmph. Kunci itu bukan jawabanmu sendiri.':'GRR! Hello World-mu jalan. Menyebalkan.'):(h.gave?'Menyerah, ya? Hehe.':TAUNT[h.i]);
      out='<section class="panel hellbox"><div class="hero"><span>'+banana(mood,132)+'</span><div class="txt"><p class="eyebrow">'+esc(eb)+'</p><h2>Tantangan: Hello, World!</h2><div class="bubble" role="status">'+esc(say)+'</div></div></div></section>';
      out+='<section class="panel"><div class="q" id="hq" tabindex="-1"><div class="qh"><span class="n">'+(loc+1)+'</span><div style="min-width:0;flex:1"><span class="tag">Tulis kode</span>'+codeBody(s.lg)
        +'<div class="toolrow"><button type="button" class="btn" data-act="hrun">Jalankan</button><button type="button" class="btn ghost sm" data-act="hkey">Lihat kunci (tanpa poin)</button></div>'
        +'<pre class="hout" id="hout" aria-live="polite">'+esc(h.ran?((h.err?'[Galat] '+h.err+'\n':'')+(h.out.length>300?h.out.slice(0,300)+'...':h.out)):'(keluaran program tampil di sini)')+'</pre>'
        +(h.solved?fbHtml('good','<b>Berhasil.</b> Programmu mencetak Hello, World!'+(h.gave?' Karena kamu memakai kunci, soal ini tidak dihitung.':''),'cheer'):'')
        +((h.solved||h.gave)?'<div class="acts"><button type="button" class="btn" data-act="hnext">'+(h.i===NSTEP-1?'Lihat nasibmu':'Lanjut')+'</button></div>':'')
        +'</div></div></div></section>';
    }
  }
  document.getElementById('main').innerHTML=out;
  if(!h.done&&ST[h.i].lg==='Piet'&&ST[h.i].kind==='code')setupPiet();
  updateProgress(true);
}
function hellRun(){
  const h=HL,lg=ST[h.i].lg;let r;
  if(lg==='Brainfuck'){const t=document.getElementById('bfsrc');if(t)h.bf=t.value;r=ESO.bfRun(h.bf);}
  else if(lg==='Whitespace')r=ESO.wsRun(h.ws);
  else r=ESO.pietRun(Array.from(h.gx),GW,GH);
  h.out=r.out;h.err=r.err||'';h.ran=true;
  const ok=judge(r.out,lg)&&(lg==='Piet'||!r.err);
  if(ok&&!h.solved){h.solved=true;showHell();window.scrollTo({top:0});}
  else{const o=document.getElementById('hout');if(o)o.textContent=(h.err?'[Galat] '+h.err+'\n':'')+(h.out.length>300?h.out.slice(0,300)+'...':h.out||'(tidak ada keluaran)');}
}
function hellClick(act,b){
  if(!/^(h(pick|next|retry|run|key)|ws(add|del|clr|push|out|end)|p(tool|color|clear))$/.test(act))return false;
  if(act==='hretry'){HL=newHL();showHell();window.scrollTo(0,0);return true;}
  if(!HL)return true;
  const h=HL;
  if(act==='hpick'&&h.pick===null){
    h.pick=+b.dataset.o;if(h.pick===0)h.ok++;
    showHell();
    const el=document.getElementById('hq');if(el){try{el.focus({preventScroll:true});}catch(e){}}
  }else if(act==='hnext'){
    const s=ST[h.i];
    if(s.kind==='mcq'&&h.pick===null)return true;
    if(s.kind==='code'){if(!(h.solved||h.gave))return true;if(h.solved&&!h.gave)h.ok++;}
    h.i++;h.pick=null;h.out='';h.err='';h.ran=false;h.solved=false;h.gave=false;
    if(h.i>=NSTEP){h.done=true;S.hell=Math.max(S.hell||0,h.ok);save();if(h.ok===NSTEP)confetti();}
    showHell();window.scrollTo(0,0);
  }
  else if(act==='hrun')hellRun();
  else if(act==='hkey'){
    const lg=ST[h.i].lg;h.gave=true;
    if(lg==='Brainfuck'){h.bf='++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.';}
    else if(lg==='Whitespace')h.ws=ESO.wsGen('Hello, World!');
    else setPietKey();
    h.ran=false;showHell();
  }
  else if(act==='wsadd'){h.ws+=b.dataset.s;wsRefresh();}
  else if(act==='wsdel'){h.ws=h.ws.slice(0,-1);wsRefresh();}
  else if(act==='wsclr'){h.ws='';wsRefresh();}
  else if(act==='wspush'){const n=Math.max(0,Math.min(255,parseInt((document.getElementById('wsnum')||{}).value,10)||0));h.ws+='SS'+ESO.wsNum(n);wsRefresh();}
  else if(act==='wsout'){h.ws+='TLSS';wsRefresh();}
  else if(act==='wsend'){h.ws+='LLL';wsRefresh();}
  else if(act==='pcolor'){h.color=+b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.c===h.color)));}
  else if(act==='ptool'){h.tool=b.dataset.t;document.querySelectorAll('[data-act="ptool"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===h.tool)));const cv=document.getElementById('piet');if(cv)cv.style.touchAction=h.tool==='pan'?'auto':'none';}
  else if(act==='pclear'){h.gx.fill(255);drawPiet();}
  return true;
}
main.addEventListener('input',e=>{if(e.target.id==='bfsrc'&&HL)HL.bf=e.target.value;});
(function(){
  const lg=document.getElementById('logo'), ev=document.getElementById('evil'), wrap=lg.parentNode;
  let n=0, back_t=null, nt=null;
  function back(){wrap.classList.remove('open');ev.setAttribute('aria-hidden','true');ev.tabIndex=-1;n=0;clearTimeout(back_t);}
  function hit(){
    if(wrap.classList.contains('open'))return;
    n++;clearTimeout(nt);nt=setTimeout(()=>{n=0;},3000);
    lg.classList.remove('shake');void lg.offsetWidth;lg.classList.add('shake');
    if(n>=3){wrap.classList.add('open');ev.removeAttribute('aria-hidden');ev.tabIndex=0;toast('<b>Apeli kabur!</b><br>Ada sesuatu di belakangnya...','wow');back_t=setTimeout(back,8000);}
    else toast('Aduh! Tinggal '+(3-n)+' klik lagi...','oops');
  }
  lg.addEventListener('click',hit);
  lg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit();}});
  ev.addEventListener('click',()=>{back();HL=null;if(location.hash==='#neraka')route(false);else location.hash='#neraka';});
})();
/* ---------- Simpan ke akun (cloud) ---------- */
(function(){
  const el=document.getElementById('sync');
  const say=t=>{if(el)el.textContent=t;};
  let ref=null, timer=null;
  const fin=o=>{o=o||{};o.ok=o.ok||{};o.badge=o.badge||{};o.exam=o.exam||{best:0,n:0};return o;};
  cloudPush=()=>{
    if(!ref)return;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      say('Menyimpan ke akunmu...');
      ref.set({json:JSON.stringify(S),t:S.t||Date.now()}).then(()=>say('Progres tersimpan di akunmu dan di browser ini.'),()=>say('Gagal menyimpan ke akun. Progres tetap ada di browser ini.'));
    },700);
  };
  (async()=>{
    try{
      if(!window.claude||!claude.use)return;
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user||!user.id){return;}
      const id=await user.id(); if(!id)return;
      ref=db.collection('data/users/'+id).doc('progress');
      const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
      const d=snap.exists?snap.data():null;
      let remote=null;
      if(d&&d.json){try{remote=fin(JSON.parse(d.json));remote.t=d.t||0;}catch(e){}}
      if(remote&&(remote.t||0)>(S.t||0)){
        S=remote;
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        say('Progres dimuat dari akunmu.');
        if(cur!=='exam'||!EX||EX.done)route(true);
      }else if(Object.keys(S.ok).length||S.exam.n){
        cloudPush();
      }else{say('Progres tersimpan di akunmu dan di browser ini.');}
    }catch(e){say('Progres tersimpan di browser ini saja.');}
  })();
})();
document.getElementById('logo').innerHTML=apel('happy',60);
window.addEventListener('hashchange',()=>route(false));
route(true);booted=true;
})();
